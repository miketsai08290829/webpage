<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人網站 - 大學老師</title>
  <style>
    /* 全局樣式 */
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #e0e0e0;
    }

    header {
      background: linear-gradient(135deg, #1f1f1f, #333333);
      color: #00d4ff;
      padding: 30px;
      text-align: center;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6);
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #121212;
      padding: 15px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6);
    }

    nav a {
      color: #00d4ff;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #ffffff;
    }

    section {
      padding: 40px 20px;
      text-align: center;
    }

    .hero {
      padding: 60px 20px;
      background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      margin: 20px auto;
      max-width: 1200px;
    }

    .hero h1 {
      font-size: 3em;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #00d4ff, #00ff99);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.2em;
      color: #b0b0b0;
    }

    .contact-form {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a1a;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
    }

    .contact-form label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #00d4ff;
    }

    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #121212;
      color: #e0e0e0;
    }

    .contact-form button {
      background: linear-gradient(90deg, #00d4ff, #00ff99);
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    .contact-form button:hover {
      background: linear-gradient(90deg, #00ff99, #00d4ff);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #121212;
      color: #b0b0b0;
      box-shadow: 0px -4px 10px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <header>
    <h1>歡迎來到我的科技風個人網站</h1>
    <p>我是[你的名字]，專注於教學與研究</p>
  </header>

  <nav>
    <a href="#about">關於我</a>
    <a href="#research">研究與出版</a>
    <a href="#teaching">教學資源</a>
    <a href="#contact">聯絡我</a>
  </nav>

  <section class="hero" id="about">
    <h1>關於我</h1>
    <p>這裡可以放置你的個人簡介，例如教育背景、研究領域和教學經歷。</p>
  </section>

  <section id="research">
    <h2>研究與出版</h2>
    <p>列出你的研究方向以及已發表的論文或出版物。</p>
  </section>

  <section id="teaching">
    <h2>教學資源</h2>
    <p>提供學生下載教學材料的地方，例如課程大綱和教材。</p>
  </section>

  <section id="contact">
    <h2>聯絡我</h2>
    <div class="contact-form">
      <form action="#" method="POST">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" required>

        <label for="email">電子郵件</label>
        <input type="email" id="email" name="email" required>

        <label for="message">留言</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">提交</button>
      </form>
    </div>
  </section>

  <footer>
    <p>© 2025 [你的名字]. 保留所有權利。</p>
  </footer>
</body>
</html>
